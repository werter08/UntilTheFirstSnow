<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* The game always fills its window (the itch.io frame, or the whole screen in fullscreen) at 16:9;
         any leftover space becomes dark bars, so nothing is stretched or cut. */
      @font-face { font-family: "Playpen Sans"; src: url("TemplateData/PlaypenSans-Medium.ttf") format("truetype"); font-display: block; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1714; }
      #unity-stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; background: #1c1714; }

      /* Loading: the title in the handwritten font and a warm-orange bar, then it fades away. */
      #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                gap: 28px; background: #1c1714; color: #f3e6d4; font-family: "Playpen Sans", cursive, sans-serif;
                transition: opacity 0.6s ease; z-index: 1; }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader h1 { margin: 0; padding: 0 16px; font-weight: 500; font-size: clamp(28px, 6vw, 64px); text-align: center; }
      #loader-track { width: min(360px, 70vw); height: 10px; border-radius: 5px; background: rgba(232, 149, 90, 0.18); overflow: hidden; }
      #loader-bar { width: 0%; height: 100%; border-radius: 5px; background: #e8955a; transition: width 0.2s ease; }
    </style>
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
  </head>
  <body>
    <div id="unity-stage">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="loader">
      <h1>Until the First Snow</h1>
      <div id="loader-track"><div id="loader-bar"></div></div>
    </div>
#if SHOW_DIAGNOSTICS
    <div id="unity-footer">
        <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
    </div>
#endif
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var aspect = 16 / 9;
      var loader = document.querySelector("#loader");
      var loaderBar = document.querySelector("#loader-bar");

      // Largest 16:9 box that fits the window; Unity renders at that size (sharp on high-DPI screens too).
      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        var cw = w, ch = w / aspect;
        if (ch > h) { ch = h; cw = h * aspect; }
        canvas.style.width = Math.floor(cw) + "px";
        canvas.style.height = Math.floor(ch) + "px";
      }
      window.addEventListener("resize", fit);
      document.addEventListener("fullscreenchange", fit);
      fit();

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Cap the render scale: a 4K screen at 2x would be needlessly heavy for a cozy 2D game.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, (progress) => {
        loaderBar.style.width = Math.round(progress * 100) + "%";
      }).then((unityInstance) => {
        fit();
        loaderBar.style.width = "100%";
        loader.classList.add("done");
        setTimeout(() => loader.remove(), 700);
#if SHOW_DIAGNOSTICS
        document.getElementById("diagnostics-icon").onclick = () => {
            unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
        };
#endif
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
